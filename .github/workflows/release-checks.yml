name: Release functional regression

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'testdata/**', 'package*.json', 'vite.config.ts', 'tsconfig*.json', '.github/workflows/**']
  push:
    branches: [dev, dev-improvements]
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'testdata/**', 'package*.json', 'vite.config.ts', 'tsconfig*.json', '.github/workflows/**']

permissions:
  contents: read

jobs:
  frontend:
    name: All feature regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run every frontend feature test, type check and production build
        run: npm run test:release -- --phase frontend
      - name: Upload per-feature results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-features-${{ matrix.os }}-${{ github.run_id }}
          path: output/release-checks/
          if-no-files-found: error
          retention-days: 14
