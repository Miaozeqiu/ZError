name: MCP checks

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-checks.yml'
      - 'package*.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'testdata/mcp/**'
  push:
    branches: [master, dev-improvements]
    paths:
      - '.github/workflows/mcp-checks.yml'
      - 'package*.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'testdata/mcp/**'

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcp
      - run: npx vite build

  stdio-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib mcp::tests
