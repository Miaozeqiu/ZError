name: Search checks

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-checks.yml'
      - 'package*.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'testdata/mcp/**'
      - 'testdata/agent/**'
      - 'testdata/browser/**'
      - 'testdata/sites/**'
  push:
    branches: [master, dev-improvements]
    paths:
      - '.github/workflows/mcp-checks.yml'
      - 'package*.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'testdata/mcp/**'
      - 'testdata/agent/**'
      - 'testdata/browser/**'
      - 'testdata/sites/**'

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcp
      - name: Browser and Zhihuishu regression tests
        run: >-
          npx vitest run
          testdata/sites/zhihuishu.test.ts
          testdata/sites/zhihuishu-study.test.ts
          testdata/browser/native-watch.test.ts
          testdata/browser/native-watch-tools.test.ts
          testdata/browser/native-watch-generation.test.ts
          testdata/browser/tab-limit.test.ts
          testdata/agent/browser-loop.test.ts
          testdata/agent/finish-gate.test.ts
          testdata/agent/skill-storage.test.ts
          testdata/agent/agent-browser-workspace.test.ts
      - run: npx vite build

  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features
