name: Windows CDP diagnostic
on:
  push:
    branches: [codex/windows-cdp-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dotnet run --project scripts/windows-cdp-probe/Probe.csproj
