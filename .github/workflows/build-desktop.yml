name: Build desktop installers

on:
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [dev-improvements]
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'src/composables/useAppUpdate.ts'
      - 'src/components/ui/UpdateDialog.vue'

permissions:
  contents: read

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Configure installer build
        run: |
          node -e 'require("node:fs").writeFileSync(".tauri-ci.json", JSON.stringify({ bundle: { createUpdaterArtifacts: false } }))'

      - name: Build Windows NSIS installer
        run: npm exec -- tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config .tauri-ci.json -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZError-windows-x64-${{ github.run_id }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  macos:
    if: inputs.macos
    name: macos-arm64
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - name: Download and verify the pinned CEF SDK
        env:
          GH_TOKEN: ${{ github.token }}
          CEF_PACKAGE: ghcr.io/miaozeqiu/zerror-cef@sha256:95864b11df1b7a75a1f611dd10a5dea306a4113444f3fe37721fbb76575718d3
          CEF_ARCHIVE_SHA256: cf8fcf7eb8f6e62cf449722c4d84a48ba2a6100e9709b24554ecca3b31a3109c
        run: |
          set -euo pipefail
          sdk=$(mktemp -d)
          trap 'rm -rf "$sdk"' EXIT
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --registry-config "$sdk/auth.json"
          oras pull --registry-config "$sdk/auth.json" --output "$sdk" "$CEF_PACKAGE"
          archive=cef-151.3.24-macos-arm64.tar.gz
          cat "$sdk/$archive".part-* > "$sdk/$archive"
          (cd "$sdk" && printf '%s  %s\n' "$CEF_ARCHIVE_SHA256" "$archive" | shasum -a 256 -c)
          CEF_PATH="$RUNNER_TEMP/zerror-cef"
          mkdir -p "$CEF_PATH"
          tar -xzf "$sdk/$archive" -C "$CEF_PATH"
          test -f "$CEF_PATH/151.3.24/cef_macos_aarch64/.zerror-codecs"
          printf 'CEF_PATH=%s\n' "$CEF_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: cef-151.3.24-${{ hashFiles('.github/workflows/build-desktop.yml') }}
      - name: Install CEF build dependencies
        run: |
          for tool in cmake ninja; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
      - run: npm ci
      - name: Build macOS installer and updater bundle
        env:
          ZERROR_SKIP_UPDATER_SIGN: '1'
        run: bash scripts/build-release-macos.sh
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ZError-macos-arm64-${{ github.run_id }}
          path: |
            output/release-v*/*.dmg
            output/release-v*/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  linux:
    name: linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .tauri-ci.json
          npm exec -- tauri build --ci --target x86_64-unknown-linux-gnu --bundles deb,appimage --config .tauri-ci.json -- --locked
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ZError-linux-x64-${{ github.run_id }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          overwrite: true
