name: Build desktop installers

on:
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [dev-improvements]
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'src/composables/useAppUpdate.ts'
      - 'src/components/ui/UpdateDialog.vue'

permissions:
  contents: read

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Configure installer build
        run: |
          node -e 'require("node:fs").writeFileSync(".tauri-ci.json", JSON.stringify({ bundle: { createUpdaterArtifacts: false } }))'

      - name: Build Windows NSIS installer
        run: node scripts/tauri-cli.mjs build --ci --target x86_64-pc-windows-msvc --bundles nsis --config .tauri-ci.json -- --locked

      - name: Verify native CLI
        run: .\src-tauri\target\x86_64-pc-windows-msvc\release\zerror-cli.exe --version

      - name: Native regression and skill update checks
        run: npm run test:release -- --phase native --release --target x86_64-pc-windows-msvc --cli src-tauri/target/x86_64-pc-windows-msvc/release/zerror-cli.exe --output output/release-native
      - name: Install the generated Windows package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($packages.Count -ne 1) { throw "Expected exactly one installer" }
          $directory = Join-Path $env:RUNNER_TEMP 'zerror-installed'
          $installer = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', "/D=$directory") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $cli = Join-Path $directory 'zerror-cli.exe'
          if (!(Test-Path $cli)) { throw 'Native CLI missing from installed package' }
          $launcher = Join-Path $env:LOCALAPPDATA 'ZError\bin\zerror.cmd'
          if (!(Test-Path $launcher)) { throw 'CLI launcher was not installed automatically' }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $command = Get-Command zerror -CommandType Application -ErrorAction Stop
          if ($command.Source -ne $launcher) { throw 'Installed zerror is not discoverable through user PATH' }
          zerror --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed zerror launcher failed' }
          "ZERROR_INSTALLED_CLI=$cli" >> $env:GITHUB_ENV
      - name: Installed desktop functional regression
        shell: pwsh
        run: npm run test:release -- --phase desktop --start --cli "$env:ZERROR_INSTALLED_CLI" --output output/release-desktop
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-regression-x86_64-pc-windows-msvc-${{ github.run_id }}
          path: |
            output/release-native/
            output/release-desktop/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZError-windows-x64-${{ github.run_id }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  macos:
    if: inputs.macos || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev-improvements')
    name: macos-arm64
    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.0
      - name: Download and verify the pinned CEF SDK
        env:
          GH_TOKEN: ${{ github.token }}
          CEF_PACKAGE: ghcr.io/miaozeqiu/zerror-cef@sha256:95864b11df1b7a75a1f611dd10a5dea306a4113444f3fe37721fbb76575718d3
          CEF_ARCHIVE_SHA256: cf8fcf7eb8f6e62cf449722c4d84a48ba2a6100e9709b24554ecca3b31a3109c
        run: |
          set -euo pipefail
          sdk=$(mktemp -d)
          trap 'rm -rf "$sdk"' EXIT
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --registry-config "$sdk/auth.json"
          oras pull --registry-config "$sdk/auth.json" --output "$sdk" "$CEF_PACKAGE"
          archive=cef-151.3.24-macos-arm64.tar.gz
          cat "$sdk/$archive".part-* > "$sdk/$archive"
          (cd "$sdk" && printf '%s  %s\n' "$CEF_ARCHIVE_SHA256" "$archive" | shasum -a 256 -c)
          CEF_PATH="$RUNNER_TEMP/zerror-cef"
          mkdir -p "$CEF_PATH"
          tar -xzf "$sdk/$archive" -C "$CEF_PATH"
          test -f "$CEF_PATH/151.3.24/cef_macos_aarch64/.zerror-codecs"
          printf 'CEF_PATH=%s\n' "$CEF_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: cef-151.3.24-${{ hashFiles('.github/workflows/build-desktop.yml') }}
      - name: Install CEF build dependencies
        run: |
          for tool in cmake ninja; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
      - run: npm ci
      - name: Build macOS installer and updater bundle
        env:
          ZERROR_SKIP_UPDATER_SIGN: '1'
        run: bash scripts/build-release-macos.sh
      - name: Verify bundled native CLI
        run: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZError.app/Contents/MacOS/zerror-cli --version
      - name: Native regression and skill update checks
        run: npm run test:release -- --phase native --release --target aarch64-apple-darwin --cli src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ZError.app/Contents/MacOS/zerror-cli --output output/release-native
      - name: Install the generated macOS disk image
        run: |
          images=(output/release-v*/*.dmg)
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/zerror-install-volume"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount" || true' EXIT
          ditto "$mount/ZError.app" "$RUNNER_TEMP/ZError-installed.app"
          test -x "$RUNNER_TEMP/ZError-installed.app/Contents/MacOS/zerror-cli"
          printf 'ZERROR_INSTALLED_CLI=%s\n' "$RUNNER_TEMP/ZError-installed.app/Contents/MacOS/zerror-cli" >> "$GITHUB_ENV"
      - name: Installed desktop functional regression
        # 使用临时的真实钥匙串，避免依赖 runner 的桌面登录和默认钥匙串状态。
        # 正式安装包仍走原生 Keychain API，不提供测试后门或明文存储。
        env:
          ZERROR_CI_KEYCHAIN: ${{ runner.temp }}/zerror-ci.keychain-db
        run: |
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$ZERROR_CI_KEYCHAIN"
          trap 'security delete-keychain "$ZERROR_CI_KEYCHAIN"' EXIT
          security set-keychain-settings -lut 21600 "$ZERROR_CI_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$ZERROR_CI_KEYCHAIN"
          security default-keychain -d user -s "$ZERROR_CI_KEYCHAIN"
          security list-keychains -d user -s "$ZERROR_CI_KEYCHAIN"
          npm run test:release -- --phase desktop --start --cli "$ZERROR_INSTALLED_CLI" --output output/release-desktop
      - name: Verify automatic macOS CLI setup
        run: |
          test -x "$HOME/.local/bin/zerror"
          /bin/zsh -lc 'zerror --version'
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-regression-aarch64-apple-darwin-${{ github.run_id }}
          path: |
            output/release-native/
            output/release-desktop/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZError-macos-arm64-${{ github.run_id }}
          path: |
            output/release-v*/*.dmg
            output/release-v*/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  linux:
    name: linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 xvfb dbus-x11 gnome-keyring libsecret-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: |
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > .tauri-ci.json
          node scripts/tauri-cli.mjs build --ci --target x86_64-unknown-linux-gnu --bundles deb,appimage --config .tauri-ci.json -- --locked
      - name: Verify native CLI
        run: src-tauri/target/x86_64-unknown-linux-gnu/release/zerror-cli --version
      - name: Native regression and skill update checks
        run: npm run test:release -- --phase native --release --target x86_64-unknown-linux-gnu --cli src-tauri/target/x86_64-unknown-linux-gnu/release/zerror-cli --output output/release-native
      - name: Install the generated Linux package and check AppImage entry
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          packages=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          images=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#packages[@]}" -eq 1
          test "${#images[@]}" -eq 1
          sudo apt-get install -y "$(realpath "${packages[0]}")"
          test -x /usr/bin/zerror-cli
          timeout 10s zerror --version
          "${images[0]}" cli --version
      - name: Installed desktop functional regression
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail <<'DESKTOP'
          # 无桌面登录的 CI 需要真实且已解锁的 Secret Service，不能绕过凭据隔离。
          desktop_runtime_dir=$(mktemp -d)
          export XDG_RUNTIME_DIR="$desktop_runtime_dir"
          trap 'rm -rf "$desktop_runtime_dir"' EXIT
          printf '%s' 'zerror-ci-test-keyring' | gnome-keyring-daemon --daemonize --unlock --components=secrets
          printf '%s' 'ready' | secret-tool store --label='ZError CI readiness' zerror-ci readiness
          test "$(secret-tool lookup zerror-ci readiness)" = ready
          secret-tool clear zerror-ci readiness
          npm run test:release -- --phase desktop --start --cli /usr/bin/zerror-cli --output output/release-desktop
          DESKTOP
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-regression-x86_64-unknown-linux-gnu-${{ github.run_id }}
          path: |
            output/release-native/
            output/release-desktop/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZError-linux-x64-${{ github.run_id }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          overwrite: true
