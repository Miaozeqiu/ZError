name: Build and publish release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft with all desktop installers and Tauri updater signatures
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-desktop:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-desktop.yml

  prepare-release:
    name: Prepare release draft
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ZError-*-x64-${{ github.run_number }}
          path: installers
          merge-multiple: true
      - name: Stage Windows and Linux installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/master
          version="${TAG#v}"
          test "$(jq -er .version src-tauri/tauri.conf.json)" = "$version"

          mkdir staged
          for artifact in "ZError_${version}_x64-setup.exe" "ZError_${version}_amd64.AppImage" "ZError_${version}_amd64.deb"; do
            mapfile -t matches < <(find installers -type f -iname "$artifact")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" "staged/$artifact"
          done

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true
            gh release upload "$TAG" staged/* --clobber
          else
            gh release create "$TAG" staged/* --draft --verify-tag --title "ZError $TAG" --generate-notes
          fi

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    name: Verify and publish all desktop assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install updater signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Verify release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$TAG^{commit}" HEAD
          version="${TAG#v}"
          config=$(git show "$TAG:src-tauri/tauri.conf.json")
          test "$(jq -er .version <<< "$config")" = "$version"

          windows="ZError_${version}_x64-setup.exe"
          mac="ZError_${version}_aarch64.app.tar.gz"
          linux="ZError_${version}_amd64.AppImage"
          release=$(gh release view "$TAG" --json isDraft,assets)
          jq -e '.isDraft' <<< "$release"
          for asset in "$windows" "$windows.sig" "$mac" "$mac.sig" "ZError_${version}_aarch64.dmg" "$linux" "$linux.sig" "ZError_${version}_amd64.deb"; do
            jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .size > 0)' <<< "$release"
          done

          check_dir=$(mktemp -d)
          jq -er .plugins.updater.pubkey <<< "$config" | base64 --decode > "$check_dir/updater.pub"
          for asset in "$windows" "$mac" "$linux"; do
            gh release download "$TAG" --pattern "$asset" --pattern "$asset.sig" --dir "$check_dir"
            base64 --decode "$check_dir/$asset.sig" > "$check_dir/updater.minisig"
            minisign -Vm "$check_dir/$asset" -p "$check_dir/updater.pub" -x "$check_dir/updater.minisig"
          done
          gh release edit "$TAG" --draft=false --latest
