<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZError - OCS AI题库软件</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module">
      if (import.meta.env.DEV) {
        const boot = (text) => {
          fetch('http://localhost:1420/__agent-debug-log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file: 'bridge-boot', replace: true, ext: 'txt', text }),
          }).catch(() => {})
        }
        boot(`index ${new Date().toISOString()} ${location.href} tauri=${typeof window.__TAURI_INTERNALS__ !== 'undefined'}\n`)
        if (window.__TAURI_INTERNALS__) {
          import('/src/services/agent/cursorBridge.ts')
            .then((mod) => mod.startCursorBridge())
            .catch((error) => boot(`import-fail ${error}\n`))
        }
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
