<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导航</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #2d3748;
      --muted: #718096;
      --line: rgba(45, 55, 72, 0.08);
      --accent: #2F6F78;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .wrap {
      width: min(680px, 100%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    a.site {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    /* 卡片 hover 会上移，命中区随之离开指针；补齐下沿避免 hover 反复得失、光标闪烁 */
    a.site::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 4px;
    }
    a.site:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      box-shadow: 0 10px 28px rgba(47, 111, 120, 0.12);
    }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      flex: 0 0 44px;
    }
    .mark.cx { background: #2F6F78; }
    .mark.zs { background: #3B82A0; }
    .copy { min-width: 0; }
    .name {
      font-size: 16px;
      font-weight: 650;
    }
    .url {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>导航</h1>
    <p>选择一个学习平台开始</p>
    <div class="grid">
      <a class="site" href="https://passport2.chaoxing.com">
        <span class="mark cx">学</span>
        <span class="copy">
          <span class="name">学习通</span>
          <span class="url">passport2.chaoxing.com</span>
        </span>
      </a>
      <a class="site" href="https://www.zhihuishu.com/">
        <span class="mark zs">智</span>
        <span class="copy">
          <span class="name">智慧树</span>
          <span class="url">zhihuishu.com</span>
        </span>
      </a>
    </div>
  </div>
</body>
</html>
