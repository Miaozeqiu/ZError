<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 开发态导航页在 localhost；带 Referer 打开学习通会被拒：localhost 该域名未授权 -->
  <meta name="referrer" content="no-referrer" />
  <title>导航</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #2d3748;
      --muted: #718096;
      --line: rgba(45, 55, 72, 0.08);
      --accent: #2F6F78;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .wrap {
      width: min(680px, 100%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    a.site {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    /* 卡片 hover 会上移，命中区随之离开指针；补齐下沿避免 hover 反复得失、光标闪烁 */
    a.site::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 4px;
    }
    a.site:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      box-shadow: 0 10px 28px rgba(47, 111, 120, 0.12);
    }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      flex: 0 0 44px;
    }
    .mark.cx { background: #2F6F78; }
    .mark.zs { background: #3B82A0; }
    .mark.zj { background: #C45C26; }
    .mark.ze { background: #1f1f1f; }
    .mark.db { background: #5B6CFF; }
    .mark.ds { background: #4D6BFE; }
    .mark.qw { background: #6B4CFF; }
    .mark.gpt { background: #10A37F; }
    .mark.gm { background: #1A73E8; }
    .copy { min-width: 0; }
    .name {
      font-size: 16px;
      font-weight: 650;
    }
    .url {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>导航</h1>
    <p>选择一个网址开始</p>
    <div class="grid">
      <a class="site" href="https://t.zerror.cc/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark ze">Z</span>
        <span class="copy">
          <span class="name">ZError</span>
          <span class="url">t.zerror.cc</span>
        </span>
      </a>
      <a class="site" href="https://www.doubao.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark db">豆</span>
        <span class="copy">
          <span class="name">豆包</span>
          <span class="url">doubao.com</span>
        </span>
      </a>
      <a class="site" href="https://chat.deepseek.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark ds">D</span>
        <span class="copy">
          <span class="name">DeepSeek</span>
          <span class="url">chat.deepseek.com</span>
        </span>
      </a>
      <a class="site" href="https://www.qianwen.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark qw">千</span>
        <span class="copy">
          <span class="name">千问</span>
          <span class="url">qianwen.com</span>
        </span>
      </a>
      <a class="site" href="https://chatgpt.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark gpt">G</span>
        <span class="copy">
          <span class="name">ChatGPT</span>
          <span class="url">chatgpt.com</span>
        </span>
      </a>
      <a class="site" href="https://gemini.google.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark gm">星</span>
        <span class="copy">
          <span class="name">Gemini</span>
          <span class="url">gemini.google.com</span>
        </span>
      </a>
      <a class="site" href="https://passport2.chaoxing.com/login?fid=&newversion=true&refer=https%3A%2F%2Fi.chaoxing.com" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark cx">学</span>
        <span class="copy">
          <span class="name">学习通</span>
          <span class="url">passport2.chaoxing.com</span>
        </span>
      </a>
      <a class="site" href="https://www.zhihuishu.com/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark zs">智</span>
        <span class="copy">
          <span class="name">智慧树</span>
          <span class="url">zhihuishu.com</span>
        </span>
      </a>
      <a class="site" href="https://www.zjooc.cn/" rel="noreferrer" referrerpolicy="no-referrer">
        <span class="mark zj">之</span>
        <span class="copy">
          <span class="name">之江在线</span>
          <span class="url">zjooc.cn</span>
        </span>
      </a>
    </div>
  </div>
  <script>
    (function () {
      document.addEventListener('click', function (event) {
        if (event.defaultPrevented || event.button) return
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
        var link = event.target && event.target.closest ? event.target.closest('a.site') : null
        var href = link && link.href
        if (!href) return
        event.preventDefault()
        try { document.title = 'ZRNAV:' + href } catch (e) {}
        document.documentElement.style.background = '#fff'
        document.body.replaceChildren()
        document.body.style.cssText = 'margin:0;background:#fff;min-height:100vh'
        var meta = document.querySelector('meta[name="referrer"]')
        if (!meta) {
          meta = document.createElement('meta')
          meta.name = 'referrer'
          document.head.appendChild(meta)
        }
        meta.content = 'no-referrer'
        location.replace(href)
      })
    })()
  </script>
</body>
</html>
