<!DOCTYPE html>

<body>
  <div class="questionLi" data="q-101" typename="单选题">

    <div class="stem_answer">
      <div class="answerBg" aria-checked="true">
        <span class="num_option check_answer" data="A"></span>

      <div class="answerBg">
        <span class="num_option" data="B"></span>

        <span class="num_option check_answer" data="B"></span>

        <p class="answer_p">C. 间断点</p>

    <h3 class="mark_name">5. （判断题）无穷小是零</h3>
    <div class="stem_answer">
      <div class="answerBg">
        <span class="num_option" data="A"></span>
        <p class="answer_p">正确</p>

      <div class="answerBg">
        <span class="num_option" data="B"></span>
        <p class="answer_p">错误</p>
